<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Cotización de alquiler | Rental ERP (demo)</title>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=source-sans-3:400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="data.js"></script>
    <script defer src="app.js"></script>
    <style>
        /* Reproduce la hoja del PDF real: cuerpo 11px, tablas con borde negro, márgenes de 30px. */
        * { box-sizing: border-box; }
        body { margin: 0; background: #d1d5db; font-family: "Source Sans 3", Calibri, Candara, Segoe, "Segoe UI", Optima, Arial, sans-serif; font-size: 11px; color: #111; }
        .toolbar { position: sticky; top: 1.75rem; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 10px; background: #374151; }
        .toolbar button, .toolbar a { min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; font: 600 14px/44px system-ui, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-print { background: #3b82f6; color: #fff; }
        .btn-print:hover { background: #2563eb; }
        .btn-back { background: #fff; color: #374151; }
        .toolbar .info { color: #e5e7eb; font: 13px system-ui, sans-serif; }
        .sheet { width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.18); position: relative; padding: 0 0 70px; overflow: hidden; }
        .letterhead { display: flex; justify-content: space-between; align-items: center; padding: 18px 30px 14px; border-bottom: 4px solid #1d4ed8; background: linear-gradient(90deg, #eff6ff, #fff 60%); }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand .mark { width: 42px; height: 42px; border-radius: 8px; background: #2563eb; color: #fff; font: 700 16px/42px system-ui, sans-serif; text-align: center; }
        .brand b { display: block; font-size: 15px; }
        .brand span { color: #4b5563; }
        .letterhead .right { text-align: right; color: #374151; line-height: 1.45; }
        .fecha { text-align: right; margin: 14px 30px 0; line-height: 1.5; }
        h2.tittle-doc { text-align: center; font-size: 17px; margin: 10px 0 0; letter-spacing: .02em; }
        .cotizacion-table { width: 100%; border-collapse: collapse; margin-top: 18px; padding: 0 25px; }
        .cotizacion-table td { padding: 4px 5px; vertical-align: top; }
        .cotizacion-table .table-name { width: 62px; padding-left: 30px; white-space: nowrap; }
        .p-after { display: block; padding: 8px 30px 0; }
        .linea-horizontal { border: 0; border-top: 1.5px solid #000; margin: 5px 30px; }
        .wrap-items { padding: 0 30px; }
        .table-items { width: 100%; border-collapse: collapse; }
        .table-items tr { page-break-inside: avoid; }
        .table-items .cell { border: 1px solid #000; text-align: center; padding: 3px; }
        .table-items th.cell { background: #f3f4f6; font-weight: 700; }
        .td-large { text-align: left !important; }
        .notas { padding: 8px 30px 0; line-height: 1.6; }
        .cuentas { margin: 10px 30px; border: 1px solid #000; padding: 8px 10px; }
        .cuentas table { border-collapse: collapse; width: 100%; }
        .cuentas td, .cuentas th { padding: 2px 6px; text-align: left; }
        .tittle-listas { padding: 0 30px; text-decoration: underline; font-weight: 700; display: block; margin-top: 10px; }
        .listas-condiciones { padding: 4px 45px; margin: 0; }
        .listas-condiciones li { padding: 2px 0; }
        .data-vendedor { margin-top: 20px; padding: 0 30px; line-height: 1.5; }
        .clausulas { padding: 0 60px; font-size: 9.5px; line-height: 1.5; text-align: justify; }
        .clausulas h3 { margin-top: 26px; text-align: center; text-decoration: underline; font-size: 12px; }
        .clausulas h4 { text-decoration: underline; margin: 16px 0 6px; font-size: 10px; }
        .footer { position: absolute; bottom: 0; left: 0; right: 0; height: 44px; background: #1d4ed8; color: #fff; display: flex; justify-content: center; align-items: center; gap: 18px; font-size: 10px; }
        .sello-demo { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%) rotate(-24deg); font: 700 54px system-ui, sans-serif; color: rgba(220, 38, 38, .07); white-space: nowrap; pointer-events: none; }
        .vacio { max-width: 560px; margin: 60px auto; background: #fff; border-radius: 10px; padding: 28px; font: 15px/1.5 system-ui, sans-serif; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
        .vacio a { color: #2563eb; }
        @media (max-width: 820px) {
            .sheet { width: auto; min-height: 0; margin: 10px 6px; }
            .wrap-items { padding: 0 8px; overflow-x: auto; }
            .table-items { min-width: 640px; }
            .clausulas { padding: 0 18px; }
            .letterhead { flex-direction: column; align-items: flex-start; gap: 8px; }
            .letterhead .right { text-align: left; }
        }
        @page { size: A4; margin: 0; }
        @media print {
            body { background: #fff; }
            .toolbar { display: none; }
            .sheet { margin: 0; box-shadow: none; width: 210mm; min-height: 296mm; page-break-after: always; }
            /* La primera hoja comparte la página con el aviso de demo (1.75rem) */
            .sheet:first-child { min-height: calc(296mm - 1.75rem); }
            .sheet:last-child { page-break-after: auto; }
            .letterhead, .footer, .table-items th.cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body class="has-demo-banner">
<div id="demo-banner" class="demo-banner" role="note"><a class="db-back" href="../">&larr; <span class="db-long">Volver al </span>portafolio</a><span class="db-note"><span class="db-long">Demo con datos ficticios · No es el sistema real</span><span class="db-short">Demo con datos ficticios</span></span><a class="db-cta" href="../#contact"><span class="db-long">¿Quieres algo así? </span>Hablemos</a></div>
    <div class="toolbar no-print">
        <a class="btn-back" href="cotizaciones.html">&larr; Volver al listado</a>
        <button type="button" class="btn-print" onclick="window.print()">&#128424; Imprimir</button>
        <span class="info" id="info-coti"></span>
    </div>
    <div id="documento"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var cont = document.getElementById('documento');
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    var id = new URLSearchParams(location.search).get('id');
    var lista = App.getCotizaciones();
    var c = id ? lista.filter(function (x) { return x.nu_cotizacion === id; })[0] : null;

    if (!c) {
        var ejemplo = lista[0];
        cont.innerHTML = '<div class="vacio"><h2 style="margin-top:0">' + (id ? 'No se encontró la cotización ' + esc(id) : 'Falta el número de cotización') + '</h2>' +
            '<p>Esta vista recibe el número en la dirección, por ejemplo <code>cotizacion-pdf.html?id=' + esc(ejemplo.nu_cotizacion) + '</code>.</p>' +
            '<p><a href="cotizacion-pdf.html?id=' + encodeURIComponent(ejemplo.nu_cotizacion) + '">Ver la cotización ' + esc(ejemplo.nu_cotizacion) + '</a> · <a href="cotizaciones.html">Ir al listado</a></p></div>';
        document.querySelector('.btn-print').style.display = 'none';
        return;
    }

    document.title = c.nu_cotizacion + ' | Cotización de alquiler (demo)';
    document.getElementById('info-coti').textContent = c.nu_cotizacion + ' · ' + c.no_cliente;
    var emp = DEMO.empresa;
    var sim = App.simbolo(c.co_moneda);
    var vend = DEMO.vendedores.filter(function (v) { return v.co_usua === c.co_usua; })[0] ||
        { name: DEMO.usuario.name, telefono: '900 000 100', email: DEMO.usuario.email };
    var fecha = new Date(c.fe_cotizacion + 'T12:00:00');
    var fechaTxt = fecha.getDate() + ' ' + App.MESES_CORTOS[fecha.getMonth()] + ' ' + fecha.getFullYear();

    var membrete = '<div class="letterhead"><div class="brand"><div class="mark">RE</div><div><b>' + esc(emp.nombre) + '</b><span>Alquiler de maquinaria y equipos</span></div></div>' +
        '<div class="right">RUC ' + esc(emp.ruc) + '<br>' + esc(emp.direccion) + '<br>' + esc(emp.correo) + '</div></div>';
    var pie = '<div class="footer"><span>' + esc(emp.web) + '</span><span>' + esc(emp.correo) + '</span><span>Documento de demostración con datos ficticios</span></div>';
    var sello = '<div class="sello-demo">DEMO · DATOS FICTICIOS</div>';

    // Filas de items, como el template real: RH y TH se despliegan en una fila por rango/tramo.
    var filas = '';
    var totalGeneral = 0;
    c.items.forEach(function (it) {
        var subtotalItem = it.total_tarifa * it.cantidad;
        totalGeneral += subtotalItem;
        var periodo = esc(it.periodo === 'Dia' ? 'Día' : it.periodo) + (it.standby ? '<br>Stand BY' : '');
        if (it.tipo_tiempo === 'RH' && it.rangos.length) {
            var mid = Math.floor(it.rangos.length / 2);
            it.rangos.forEach(function (rg, k) {
                var borde = 'border-top:' + (k === 0 ? '1px solid #000' : 'none') + ';border-bottom:' + (k === it.rangos.length - 1 ? '1px solid #000' : 'none') + ';';
                var oculto = k === mid ? '' : 'color:transparent;';
                var rango = k === it.rangos.length - 1 ? rg.ini + ' - a más' : rg.ini + ' - ' + rg.fin;
                filas += '<tr><td class="cell" style="' + borde + oculto + '">' + it.citem + '</td><td class="cell td-large" style="' + borde + oculto + '">' + esc(it.descripcion) + '</td>' +
                    '<td class="cell" style="' + borde + oculto + '">' + it.cantidad + '</td><td class="cell">' + periodo + '</td><td class="cell">' + rango + '</td>' +
                    '<td class="cell">' + App.fmt(rg.tarifa) + '</td><td class="cell">' + sim + ' <b>' + App.fmt(rg.fin * rg.tarifa) + '</b></td>' +
                    '<td class="cell">' + (k === 0 ? sim + ' <b>' + App.fmt(subtotalItem) + '</b>' : '<span style="color:#6b7280">Referencial</span>') + '</td></tr>';
            });
        } else if (it.tipo_tiempo === 'TH' && it.tarifasHora.length) {
            var midT = Math.floor(it.tarifasHora.length / 2);
            it.tarifasHora.forEach(function (th, k) {
                var borde = 'border-top:' + (k === 0 ? '1px solid #000' : 'none') + ';border-bottom:' + (k === it.tarifasHora.length - 1 ? '1px solid #000' : 'none') + ';';
                var oculto = k === midT ? '' : 'color:transparent;';
                filas += '<tr><td class="cell" style="' + borde + oculto + '">' + it.citem + '</td><td class="cell td-large" style="' + borde + oculto + '">' + esc(it.descripcion) + '</td>' +
                    '<td class="cell" style="' + borde + oculto + '">' + it.cantidad + '</td><td class="cell">' + periodo + '</td><td class="cell">' + th.horas + '</td>' +
                    '<td class="cell">' + App.fmt(th.tarifa) + '</td><td class="cell">' + sim + ' <b>' + App.fmt(th.horas * th.tarifa) + '</b></td>' +
                    '<td class="cell">' + sim + ' <b>' + App.fmt(th.horas * th.tarifa * it.cantidad) + '</b></td></tr>';
            });
        } else {
            filas += '<tr><td class="cell">' + it.citem + '</td><td class="cell td-large">' + esc(it.descripcion) + '</td><td class="cell">' + it.cantidad + '</td>' +
                '<td class="cell">' + periodo + '</td><td class="cell">' + esc(it.horas) + '</td>' +
                '<td class="cell">' + (it.tipo_tiempo === 'NA' ? '-' : App.fmt(it.costo_hora)) + '</td>' +
                '<td class="cell">' + sim + ' <b>' + App.fmt(it.total_tarifa) + '</b></td><td class="cell">' + sim + ' <b>' + App.fmt(subtotalItem) + '</b></td></tr>';
        }
    });
    var totalGrupo = totalGeneral;
    var filasServicios = '';
    c.servicios.forEach(function (s) {
        totalGeneral += Number(s.total) || 0;
        filasServicios += '<tr><td class="cell" colspan="4" style="border:0"></td><td class="cell" colspan="3" style="text-align:right">' + esc(s.descripcion || 'Servicio') + '</td><td class="cell">' + sim + ' <b>' + App.fmt(s.total) + '</b></td></tr>';
    });
    var igv = Math.round(totalGeneral * 18) / 100;
    function filaTotal(txt, v) { return '<tr><td class="cell" colspan="4" style="border:0"></td><td class="cell" colspan="3" style="text-align:right"><b>' + txt + '</b></td><td class="cell">' + sim + ' <b>' + App.fmt(v) + '</b></td></tr>'; }

    var incluye = c.condiciones.filter(function (x) { return x.tipo === 'R'; }).map(function (x) { return '<li>' + esc(x.descripcion) + '</li>'; }).join('');
    var cliente = c.condiciones.filter(function (x) { return x.tipo === 'C'; }).map(function (x) { return '<li>' + esc(x.descripcion) + '</li>'; }).join('');

    var pagina1 =
        '<div class="sheet">' + membrete + sello +
        '<div class="fecha">' + fechaTxt + '<br>' + esc(c.nu_cotizacion) + ' ' + esc(c.no_cliente) + '</div>' +
        '<h2 class="tittle-doc">COTIZACIÓN DE ALQUILER</h2>' +
        '<table class="cotizacion-table">' +
        '<tr><td class="table-name">Señores</td><td>: ' + esc(c.no_cliente) + '</td><td class="table-name" style="padding-left:5px">RUC</td><td>: ' + esc(c.co_cliente) + '</td></tr>' +
        '<tr><td class="table-name">Atención</td><td>: ' + esc(c.no_contacto) + '</td><td class="table-name" style="padding-left:5px">Teléfono</td><td>: ' + esc(c.nu_telefono) + '</td></tr>' +
        '<tr><td class="table-name">Obra</td><td>: ' + esc(c.no_obra) + '</td><td class="table-name" style="padding-left:5px">Correo</td><td>: ' + esc(c.no_correo) + '</td></tr>' +
        '</table>' +
        '<b class="p-after">Le hacemos llegar nuestra propuesta económica para el alquiler de los siguientes equipos:</b>' +
        '<b class="p-after">TARIFA ACTUAL</b><hr class="linea-horizontal"><b class="p-after" style="padding-top:0;margin-bottom:5px">GRUPO NORMAL</b>' +
        '<div class="wrap-items"><table class="table-items"><thead><tr>' +
        '<th class="cell" style="width:26px">Item</th><th class="cell">Descripción</th><th class="cell" style="width:34px">Cant.</th><th class="cell" style="width:54px">Periodo mínimo</th>' +
        '<th class="cell" style="width:78px">Hor(s)Min / Hor(s)Rango</th><th class="cell" style="width:52px">Tarifa hora</th><th class="cell" style="width:88px">Tarifa-Periodo Hor(s)Máxima</th><th class="cell" style="width:88px">Subtotal</th>' +
        '</tr></thead><tbody>' + filas + '</tbody><tbody>' +
        filaTotal('TOTAL GRUPO NORMAL', totalGrupo) + filasServicios +
        filaTotal('VALOR VENTA', totalGeneral) + filaTotal('IGV (18%)', igv) + filaTotal('PRECIO VENTA', totalGeneral + igv) +
        '</tbody></table></div>' +
        '<div class="notas"><b>**La tarifa por periodo es referencial: el monto final depende de las horas trabajadas por cada equipo.</b><br>' +
        '<b>Moneda: ' + (c.co_moneda === 'S' ? 'Soles' : 'Dólares americanos') + ' · Tipo de cambio referencial: ' + App.fmt(c.dolar_value) + '</b><br>' +
        '<b>Disponibilidad: ' + esc(c.de_dispon) + '</b><br><b>Forma de pago: ' + esc(c.de_forpago) + '</b><br><b>Observaciones: ' + esc(c.de_obs) + '</b></div>' +
        '<div class="cuentas"><table><tr><th>Cuentas bancarias (ficticias):</th><td>Moneda</td><td>CTA</td><td>CCI</td></tr>' +
        '<tr><th></th><td>Banco Ejemplo · Dólares</td><td>000-0000000-0-00</td><td>000-000-000000000000-00</td></tr>' +
        '<tr><th></th><td>Banco Demo · Soles</td><td>111-1111111-1-11</td><td>111-111-111111111111-11</td></tr></table></div>' +
        '<span class="tittle-listas">Incluye:</span><ul class="listas-condiciones">' + (incluye || '<li>Sin condiciones registradas.</li>') + '</ul>' +
        pie + '</div>';

    var pagina2 =
        '<div class="sheet">' + membrete + sello +
        '<span class="tittle-listas" style="margin-top:24px">A cuenta del cliente:</span><ul class="listas-condiciones">' + (cliente || '<li>Sin condiciones registradas.</li>') + '</ul>' +
        '<div class="data-vendedor">Quedamos atentos a su conformidad. Saludos cordiales,<br><br>' +
        '<b>' + esc(vend.name) + '</b><br><br><b>Asesor Comercial</b><br><br>Móvil: ' + esc(vend.telefono) + '<br><br>Correo: ' + esc(vend.email) + '</div>' +
        pie + '</div>';

    var clausulas = [
        ['PRIMERA. PLAZO.', 'El plazo corre desde la entrega del equipo en obra y respeta el periodo u horas mínimas indicadas en esta cotización. Termina con la devolución del equipo, que el cliente comunica por correo. Si el retiro no se coordina a tiempo, el alquiler sigue valorizándose hasta que el equipo vuelva a planta.'],
        ['SEGUNDA. TARIFAS, VALORIZACIONES Y PAGO.', 'Cada mes se valoriza según las horas o días trabajados, con el mínimo pactado. La valorización la revisan y firman ambas partes y se factura una vez aprobada. Las paradas por fallas de fabricación, reportadas por correo, no se cobran. La tarifa no incluye combustible ni operador.'],
        ['TERCERA. TIPOS DE FALLA.', 'Falla de operación: la causada por mal uso, sobrecarga o maniobras de carga y transporte; su reparación la asume el cliente. Falla de fabricación: la propia del diseño o ensamblaje del equipo; su reparación la asume la empresa.'],
        ['CUARTA. PROPIEDAD DEL EQUIPO.', 'Los equipos son propiedad de la empresa y el cliente no puede subarrendarlos ni cederlos a terceros.'],
        ['QUINTA. OBLIGACIONES DE LA EMPRESA.', 'Entregar el equipo en la fecha acordada y en buen estado; atender las fallas de fabricación con personal técnico y, si hace falta, reemplazar el equipo por otro similar; mantener vigente el seguro del equipo y el seguro de su personal; proveer filtros, lubricantes y repuestos de mantenimiento según lo cotizado.'],
        ['SEXTA. OBLIGACIONES DEL CLIENTE.', 'Pagar las valorizaciones aprobadas en el plazo pactado; cubrir los costos de fallas de operación; operar el equipo con personal calificado; avisar de inmediato cualquier siniestro y asumir el deducible del seguro cuando corresponda; coordinar el recojo y la devolución en el lugar acordado.'],
    ];
    var pagina3 = '<div class="sheet">' + membrete + sello + '<div class="clausulas"><h3>CLÁUSULAS DE ALQUILER DE EQUIPOS SIN OPERADOR</h3>' +
        '<p style="text-align:center;color:#6b7280">Texto de ejemplo redactado para la demo.</p>' +
        clausulas.map(function (cl) { return '<h4>CLÁUSULA ' + cl[0] + '</h4><p>' + cl[1] + '</p>'; }).join('') + '</div>' + pie + '</div>';

    cont.innerHTML = pagina1 + pagina2 + pagina3;
});
</script>
</body>
</html>
